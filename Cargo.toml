[workspace]
members = [
    "struum_coordinator",
    "struum_node",
    "struum_network",
    "struum_opengl",
    "struum_types",
    "struum_kernel",
    "struum_macros",
    "struum_scheduler",
]
resolver="3"

[package]
name = "struum-net"
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
struum_opengl = {path = "./struum_opengl"}
struum_types = {path = "./struum_types"}
struum_network = {path = "./struum_network"}
struum_node = {path = "./struum_node"}
struum_coordinator = {path = "./struum_coordinator"}
struum_kernel = {path = "./struum_kernel"}
struum_macros = {path = "./struum_macros"}
struum_scheduler = {path = "./struum_scheduler"}

tokio = { version = "1.53.1", features = ["full"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
serde = "1.0.229"
serde_derive = "1.0.229"
gl = "0.14.0"
glfw = "0.62.0"
bincode = "1.3.3"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.3", features = ["full"] }
regex = "1.13.1"
async-trait = "0.1.92"
uuid = { version = "1.26.0", features = ["v4"] }

[dependencies]
struum_opengl = { workspace = true }
struum_types = { workspace = true }
struum_network = { workspace = true }
struum_node  = { workspace = true }
struum_kernel = { workspace = true }
struum_macros = { workspace = true }
struum_scheduler = { workspace = true }

tokio = { workspace = true }
bytemuck = { workspace = true }
serde = { workspace = true }
serde_derive = { workspace = true }
gl = { workspace = true }
glfw = { workspace = true }
bincode = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }
regex = { workspace = true }
uuid = { workspace = true }
