[package]
name = "struum_network"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53.1", features = ["io-util", "net", "sync"] }
struum_types = { workspace = true }
serde = "1.0.229"
bincode = "1.3.3"
socket2 = "0.6"
log = { workspace = true }
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }
hmac = "0.12"
sha2 = "0.10"

[dev-dependencies]
tokio = { workspace = true }
bincode = "1.3.3"
